<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Ajith Lal R</title>
    <meta name="theme-color" content="#C8334A" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #F4EFE6;
        color: #1A1A1A;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        border: 4px solid #1A1A1A;
        background: #fff;
        padding: 32px;
        box-shadow: 10px 10px 0 #C8334A;
      }
      .badge {
        display: inline-block;
        background: #C8334A;
        color: #F4EFE6;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 6px 12px;
        border: 3px solid #1A1A1A;
      }
      h1 {
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.05;
        letter-spacing: -1px;
        margin: 18px 0 12px;
      }
      p { margin: 0 0 18px; line-height: 1.55; opacity: 0.85; }
      button {
        display: inline-block;
        background: #1A1A1A;
        color: #F4EFE6;
        border: 4px solid #1A1A1A;
        padding: 12px 18px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #C8334A; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">● Offline</span>
      <h1>You're offline.</h1>
      <p>Looks like the connection dropped. The cached portfolio shell will load automatically once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
